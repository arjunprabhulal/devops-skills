name: Validate DevOps Agent Skills

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate Skills & Manifest Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # .agents/ is generated and gitignored, so it does not exist on a fresh
      # checkout. Build it first: this catches name collisions between skills in
      # different categories, and it lets check-skills.py run its byte-for-byte
      # canonical-vs-mirror parity check, which it skips when .agents/ is absent.
      - name: Build Antigravity layout
        run: python3 scripts/build-antigravity.py

      - name: Run Skills Validator
        run: python3 scripts/check-skills.py
