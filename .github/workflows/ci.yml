name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Build the Antigravity layout, then validate everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # .agents/ is generated, not committed, so build it here. This proves the
      # build script still works and gives check-skills.py a mirror to compare
      # against the canonical tree.
      - name: Build .agents/skills/ from skills/
        run: python3 scripts/build-antigravity.py

      - name: Validate skills, references, evals, README catalogue, and manifests
        run: python3 scripts/check-skills.py

      # Nothing generated should ever land in a commit.
      - name: Fail if the build wrote anything tracked by git
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated output is tracked by git. It must be ignored:"
            git status --porcelain
            exit 1
          fi
