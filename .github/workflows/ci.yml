name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills, evals, and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all SKILL.md files, evals, README catalogue, and plugin manifest
        run: python3 scripts/check-skills.py

  generated-tree-is-current:
    name: Antigravity tree matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # .agents/skills/ is generated from skills/ and committed. Regenerating it must be a no-op;
      # a diff here means someone edited the generated tree by hand or forgot to rebuild.
      - name: Regenerate .agents/skills/ and check for drift
        run: |
          python3 scripts/build-antigravity.py
          if ! git diff --exit-code --stat; then
            echo "::error::.agents/skills/ is out of date. Run: python3 scripts/build-antigravity.py"
            exit 1
          fi
